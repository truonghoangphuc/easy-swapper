name: easy_swapper
description: "Easy Swapper - a math equation match-and-swap puzzle game."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flame: ^1.37.0
  flame_audio: ^2.12.1
  shared_preferences: ^2.5.5
  google_mobile_ads: ^9.0.0
  games_services: ^5.0.0
  in_app_review: ^2.0.12

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  # Android 8 and up ignores the square icon and asks for an adaptive pair.
  # Without these the launcher letterboxes the logo inside a white circle,
  # which looks like a bug rather than a brand.
  #
  # The inset matters: an adaptive icon's outer ~25% can be masked away by the
  # launcher's shape, so the logo is shrunk inside the safe zone rather than
  # having its edges cropped.
  adaptive_icon_background: "#0A0E16"
  adaptive_icon_foreground: "assets/images/easy_swapper_logo.png"
  adaptive_icon_foreground_inset: 20
  # Android 13 themed (monochrome) icon, used when the user turns on themed
  # icons. Falls back to the adaptive pair when they have not.
  adaptive_icon_monochrome: "assets/images/easy_swapper_logo.png"
  macos:
    generate: true
    image_path: "assets/images/easy_swapper_logo.png"
  web:
    generate: true
    image_path: "assets/images/easy_swapper_logo.png"
  image_path: "assets/images/easy_swapper_logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/audio/background/
    - assets/images/

  # Bundled, not fetched. google_fonts downloads at runtime, which needs the
  # network on first launch and shows a fallback face until it arrives - and on
  # a release Android build, where INTERNET is not granted by default, it never
  # arrives at all. See assets/fonts/README.md for provenance and licensing.
  fonts:
    - family: Baloo2
      fonts:
        - asset: assets/fonts/Baloo2-ExtraBold.ttf
          weight: 800
    - family: SourGummy
      fonts:
        - asset: assets/fonts/SourGummy-Bold.ttf
          weight: 700
