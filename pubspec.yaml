name: easy_swapper
description: "Easy Swapper - a math equation match-and-swap puzzle game."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flame: ^1.37.0
  flame_audio: ^2.12.1
  shared_preferences: ^2.5.5
  google_fonts: ^8.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/images/
